<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Poll-form">
    <meta name="author" content="Laurie Stacey">
    <link rel="stylesheet" href="">
    <body>
        <header>
            <h1>WDD130 | HTML Form - User Poll</h1>
        </header>
        <main>
           <form>
            <fieldset>
                <legend>Contact Information</legend>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>
            </fieldset>
            <label for="quantity">Select Quantity</label>
            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
            <fieldset>
                <legend>Questions</legend>
                <label for="browser">What is your favorite internet browser?</label>
                <select id="browser" name="browser">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="safari">Safari</option>
                    <option value="edge">Edge</option>
                    <option value="other">Other</option>
                </select>
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
                <label for="places">List the places you have lived:</label>
               <textarea id="places" name="places" rows="4" placeholder"Los Angeles California, London England, New York, New York"></textarea>
            </fieldset>
            <button type="submit">Submit Poll</button>
           </form> 

        </main>
        <footer>

    </footer> 
    </body>

</html>
